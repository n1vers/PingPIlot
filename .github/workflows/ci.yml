name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          include-prerelease: true

      - name: Restore dependencies
        run: dotnet restore /home/runner/work/PingPIlot/PingPIlot/PingPIlot.slnx

      - name: Build
        run: dotnet build /home/runner/work/PingPIlot/PingPIlot/PingPIlot.slnx --configuration Release --no-restore
