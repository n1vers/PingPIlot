name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, например v1.0.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref }}

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          include-prerelease: true

      - name: Restore dependencies
        run: dotnet restore .\PingPIlot.slnx

      - name: Build and publish single-file executable
        run: >
          dotnet publish .\PingPIlot\PingPIlot.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          --output .\artifacts\publish

      - name: Rename executable
        shell: pwsh
        run: |
          $exe = Get-ChildItem .\artifacts\publish -Filter *.exe | Select-Object -First 1
          if (-not $exe) {
            throw "Published executable was not found."
          }
          Move-Item $exe.FullName .\artifacts\PingPIlot-win-x64.exe

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: PingPIlot ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: artifacts/PingPIlot-win-x64.exe
